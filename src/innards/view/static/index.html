<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>innards</title>
  <meta name="description" content="Chat with an MoE model and see which experts each turn, token and topic activates in every MoE layer.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%232a78d6'/%3E%3Cpath d='M8 22V10m5 12V14m5 8v-6m5 6V8' stroke='white' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/static/style.css">
  <script src="/static/vendor/plotly-4.1.1.min.js" defer></script>
  <script src="/static/app.js" defer></script>
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="logo" aria-hidden="true"></span><span class="brand-name">innards</span></div>
    <label class="field-inline trace-pick">Trace <select id="trace"></select></label>
    <span id="live" class="live idle" aria-live="polite"><span class="dot" aria-hidden="true"></span><span id="live-text">Run folder</span></span>
  </header>

  <main id="main">
    <nav class="tabs" role="tablist" aria-label="Views">
      <button role="tab" data-tab="conversation" aria-selected="true">Conversation</button>
      <button role="tab" data-tab="moe" aria-selected="false">MoE layers</button>
      <span class="tab-spacer"></span>
      <span id="store-url" class="muted small mono"></span>
    </nav>
    <div id="banner" class="banner" role="alert" hidden></div>

    <!-- ======================================================== conversation -->
    <section id="tab-conversation" role="tabpanel" data-panel="conversation">
      <form id="load-form" class="toolbar model-bar" autocomplete="off" hidden>
        <label class="field-inline grow">Model
          <input id="model-input" list="model-list" spellcheck="false" placeholder="ibm-granite/granite-3.1-1b-a400m-instruct, or a local folder">
        </label>
        <datalist id="model-list"></datalist>
        <button id="load-btn" type="submit" class="primary">Load</button>
        <span id="load-status" class="muted small" aria-live="polite"></span>
      </form>
      <div class="toolbar">
        <label class="field-inline grow">Conversation <select id="conv"></select></label>
        <button id="new-conv" type="button" class="ghost">New conversation</button>
      </div>
      <p id="conv-note" class="muted small note"></p>
      <div class="panel chat">
        <div id="messages" class="messages" aria-live="polite"></div>
        <form id="composer" class="composer" autocomplete="off">
          <textarea id="message" rows="2" aria-label="Message" disabled></textarea>
          <div class="composer-actions">
            <label class="field-inline" title="The topic this turn's tokens are recorded under">Topic
              <input id="topic" spellcheck="false" maxlength="512" value="chat">
            </label>
            <span id="composer-status" class="muted small" aria-live="polite"></span>
            <button id="stop-btn" type="button" hidden>Stop</button>
            <button id="send-btn" type="submit" class="primary" disabled>Send</button>
          </div>
        </form>
      </div>
    </section>

    <!-- ======================================================== MoE layers -->
    <section id="tab-moe" role="tabpanel" data-panel="moe" hidden>
      <div class="toolbar">
        <label class="field-inline">Topic <select id="ex-topic"></select></label>
        <label class="field-inline">Measure
          <select id="ex-by">
            <option value="selection">Selection</option>
            <option value="gate">Gate share</option>
            <option value="lift">Lift</option>
          </select>
        </label>
        <label class="field-inline">Layer <select id="ex-layer"></select></label>
        <label class="field-inline">Coverage <input id="ex-coverage" type="number" min="0.05" max="1" step="0.05" value="0.9"></label>
        <span class="tool-spacer"></span>
        <button id="ex-download" type="button" class="ghost">Download expert set</button>
      </div>
      <div id="ex-tokens" class="grid"></div>
      <div id="ex-grid" class="grid"></div>
    </section>
  </main>
</body>
</html>
