[project]
name = "innards"
version = "0.0.2"
description = "See inside open-weight models while they run on your machine: read-only hooks on the model you loaded; for MoE models, which experts each token and topic activates during inference and training, and the expert set a topic needs; one analyzer per architectural feature; KV and memory predicted vs measured; a live web view."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Jai" }]
keywords = [
    "llm",
    "kv-cache",
    "transformers",
    "attention",
    "gqa",
    "mla",
    "deltanet",
    "mixture-of-experts",
    "moe",
    "expert-routing",
    "interpretability",
    "observability",
    "profiling",
    "inference",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: System :: Monitoring",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.28.1",
    "huggingface-hub>=1.5",
]

[project.optional-dependencies]
hf = [
    "psutil>=5.9",
    "torch>=2.4",
    "transformers>=5.0",
]
view = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
]
aws = ["boto3>=1.34"]
docs = ["pypdf>=5.0"]
all = ["innards[hf,view,aws,docs]"]

[project.urls]
Homepage = "https://pypi.org/project/innards/"
Documentation = "https://pypi.org/project/innards/#description"

[project.scripts]
innards = "innards.cli:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "moto[s3]>=5.0",
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "PT", "C4"]
ignore = ["RUF001", "RUF002", "RUF003"]  # allow × and − in text

[tool.ruff.lint.isort]
known-first-party = ["innards", "conftest", "replicas"]

[tool.mypy]
strict = true
warn_unreachable = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["transformers.*", "psutil.*", "boto3.*", "botocore.*", "pypdf.*", "tokenizers.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = ["-ra", "--strict-markers"]
markers = [
    "hf: needs the [hf] extra (torch, transformers)",
    "view: needs the [view] extra (fastapi, uvicorn)",
    "network: needs the Hugging Face Hub",
    "slow: loads real model weights",
]
filterwarnings = [
    "ignore::DeprecationWarning:torch.*",
    "ignore::FutureWarning",
    "ignore:Using `httpx` with `starlette.testclient`",
]
